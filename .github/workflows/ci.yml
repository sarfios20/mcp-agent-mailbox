name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build static Linux binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/mcp-agent-mailbox .
          sha256sum dist/mcp-agent-mailbox > dist/mcp-agent-mailbox.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-agent-mailbox-linux-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 14
